[tool.ruff]
target-version = "py311"
line-length = 88

extend-exclude = [
    ".git",
    ".idea",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "data",
    "logs",
    "models",
    "htmlcov",
    "evaluation_reports",
    "knowledge_base",
]


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]


ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]


[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "evaluations",
    "frontend",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


[tool.mypy]
python_version = "3.11"
files = ["app"]

check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

show_error_codes = true
pretty = true


[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

markers = [
    "integration: 需要多个真实组件协同的集成测试",
    "live: 需要访问真实外部 API 并可能产生费用",
]


[tool.coverage.run]
branch = true
source = ["app"]


[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
precision = 2
fail_under = 60

exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]


[tool.coverage.html]
directory = "htmlcov"
